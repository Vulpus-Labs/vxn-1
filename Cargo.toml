[workspace]
resolver = "2"
members = [
    # Shared core (E001 extraction target).
    "crates/vxn-core-utils",
    "crates/vxn-core-dsp",
    "crates/vxn-core-matrix",
    "crates/vxn-asm-check",
    "crates/vxn-core-app",
    "crates/vxn-preset",
    "crates/vxn-core-ui-web",
    "crates/vxn-core-web",
    "crates/vxn-core-clap",
    "crates/vxn-xtask-common",

    # vxn-2 (synth #2, in-flight).
    "vxn-2/crates/vxn2-dsp",
    "vxn-2/crates/vxn2-engine",
    "vxn-2/crates/vxn2-app",
    "vxn-2/crates/vxn2-ui-web",
    "vxn-2/crates/vxn2-clap",
    "vxn-2/crates/vxn2-osc-bench",
    "vxn-2/crates/vxn2-wasm",
    "vxn-2/crates/vxn2-web-controller",
    "vxn-2/xtask",

    # vxn-3 (synth #3, MVP in-flight — see vxn-3/adrs/0001, epic E021).
    "vxn-3/crates/vxn3-dsp",
    "vxn-3/crates/vxn3-engine",
    "vxn-3/crates/vxn3-app",
    "vxn-3/crates/vxn3-ui-web",
    "vxn-3/crates/vxn3-clap",
    "vxn-3/xtask",

    # vxn-1b (matrix-modulation variant of vxn-1 — see vxn-1b/adrs/0001, epic E036).
    # Reuses vxn-1's vxn-dsp verbatim; only routing + faceplate diverge.
    "vxn-1b/crates/vxn-dsp",
    "vxn-1b/crates/vxn1b-engine",
    "vxn-1b/crates/vxn1b-clap",
    "vxn-1b/crates/vxn1b-ui-web",
    "vxn-1b/crates/vxn1b-wasm",
    "vxn-1b/crates/vxn1b-web-controller",
    "vxn-1b/xtask",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Vulpus Labs"]
rust-version = "1.85"

[workspace.dependencies]
# Shared core (path).
vxn-core-utils = { path = "crates/vxn-core-utils" }
vxn-core-dsp = { path = "crates/vxn-core-dsp" }
vxn-core-matrix = { path = "crates/vxn-core-matrix" }
vxn-core-app = { path = "crates/vxn-core-app" }
vxn-preset = { path = "crates/vxn-preset" }
vxn-core-ui-web = { path = "crates/vxn-core-ui-web" }
vxn-core-web = { path = "crates/vxn-core-web" }
vxn-core-clap = { path = "crates/vxn-core-clap" }

# vxn-2 (path).
vxn2-dsp = { path = "vxn-2/crates/vxn2-dsp" }
vxn2-engine = { path = "vxn-2/crates/vxn2-engine" }
vxn2-app = { path = "vxn-2/crates/vxn2-app" }
vxn2-ui-web = { path = "vxn-2/crates/vxn2-ui-web" }

# vxn-3 (path).
vxn3-dsp = { path = "vxn-3/crates/vxn3-dsp" }
vxn3-engine = { path = "vxn-3/crates/vxn3-engine" }
vxn3-app = { path = "vxn-3/crates/vxn3-app" }
vxn3-ui-web = { path = "vxn-3/crates/vxn3-ui-web" }

# vxn-1b (path) — the canonical virtual-analogue synth since vxn-1 was retired
# (2026-08-27). `vxn-dsp` moved here with it: it is vxn-1b's kernel set now, and
# the name is kept so the ~19 call sites and the shared crates' re-exports did
# not have to churn. The original vxn-1 lives under `archive/` and is
# deliberately NOT a workspace member — it is not expected to compile.
vxn-dsp = { path = "vxn-1b/crates/vxn-dsp" }
vxn1b-engine = { path = "vxn-1b/crates/vxn1b-engine" }
vxn1b-ui-web = { path = "vxn-1b/crates/vxn1b-ui-web" }
vxn1b-web-controller = { path = "vxn-1b/crates/vxn1b-web-controller" }

# clack — pinned to a known-good main commit (no compatible crates.io release of
# this API yet). Single source of truth across all consumers.
clack-plugin = { git = "https://github.com/prokopyl/clack", rev = "f874e858ad576c601367b3038af5088a4e671744" }
clack-extensions = { git = "https://github.com/prokopyl/clack", rev = "f874e858ad576c601367b3038af5088a4e671744" }
clack-host = { git = "https://github.com/prokopyl/clack", rev = "f874e858ad576c601367b3038af5088a4e671744" }

# Release profile tuned for real-time audio DSP.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"   # ADR-style: plugins must unwind, never abort.
