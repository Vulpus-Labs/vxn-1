name: Release

# Build the CLAP/VST3 plugins for macOS and Windows and attach the binaries to
# the GitHub Release that triggered the run.
#
# The trigger fires on EVERY published release, so each job is gated on the tag
# that triggered it (0213). Two release lines share this repo:
#
#   - vxn-1 + vxn-2 ride a shared bare-semver tag (`0.1.1`), matching the
#     workspace version.
#   - vxn-1b versions independently and tags `vxn-1b-<version>`.
#
# Each job therefore carries a `startsWith(github.event.release.tag_name, ...)`
# guard. Without it, cutting a vxn-1b release would rebuild and re-attach vxn-1
# and vxn-2 binaries built from whatever main happened to be.
#
# The predicate is repeated per job rather than hoisted into `env:` on purpose:
# a job-level `if` cannot read the `env` context (only `github`, `needs`, `vars`
# and `inputs`), so an `env.` reference there resolves to the empty string —
# which would leave the vxn-1 jobs always on and the vxn-1b jobs always off,
# silently and in the direction that looks like it works.
#
# `workflow_dispatch` runs the same builds WITHOUT a release: every attach step
# is gated on the event being a real release, so a dispatch is build-and-verify
# only. Use it to prove a packaging or link change before cutting a tag — the
# Windows VST3 link bug (see the verify step below) shipped three times because
# there was no way to exercise this workflow except by publishing.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      line:
        description: "Which release line to build"
        required: true
        default: vxn-1b
        type: choice
        options: [vxn-1b, vxn-1+vxn-2]

permissions:
  contents: write

jobs:
  macos:
    name: macOS (universal)
    if: ${{ (github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'vxn-1b-')) || (github.event_name == 'workflow_dispatch' && inputs.line == 'vxn-1+vxn-2') }}
    runs-on: macos-14
    steps:
      # Submodules (clap-wrapper + vst3sdk) are needed for the VST3 build.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install Ninja
        run: brew install ninja

      - name: Build universal CLAP + VST3 bundles
        working-directory: vxn-1
        run: cargo xtask bundle --release --format clap,vst3 --universal

      # The macOS .clap/.vst3 are bundle directories; ditto zips them preserving
      # the bundle structure (and resource forks) so they unpack cleanly.
      # Guard against the /WHOLEARCHIVE class of failure: a VST3 whose Rust
      # staticlib never got force-loaded still LINKS, and still produces a
      # plausible bundle — it just has an empty factory. Nothing downstream
      # notices, so assert the engine is actually in there. Shipped broken on
      # Windows in VXN1/VXN2 0.1.1 and VXN1b 0.0.1 before this check existed.
      # CLAP first, and attached before the VST3 is verified: the two formats are
      # independent artifacts, and a VST3 that failed to absorb the staticlib is
      # no reason to withhold a CLAP that built fine. (The first cut of this
      # guard gated both, and a VST3 failure shipped a release with no Windows
      # binaries at all.)
      - name: Zip and attach the CLAP
        run: ditto -c -k --keepParent target/bundled/VXN1.clap VXN1-macOS-universal.clap.zip

      - name: Attach CLAP to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: VXN1-macOS-universal.clap.zip

      - name: Verify the VST3 embeds the engine
        run: |
          BIN=target/bundled/VXN1.vst3/Contents/MacOS/VXN1
          strings -a "$BIN" | grep -q 'labs.vulpus.vxn1' \
            || { echo "::error::VXN1.vst3 does not contain labs.vulpus.vxn1 — the staticlib was not force-loaded"; exit 1; }
          echo "ok: VXN1.vst3 embeds labs.vulpus.vxn1 ($(stat -f%z "$BIN") bytes)"

      - name: Zip and attach the VST3
        run: ditto -c -k --keepParent target/bundled/VXN1.vst3 VXN1-macOS-universal.vst3.zip

      - name: Attach VST3 to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: VXN1-macOS-universal.vst3.zip

  windows:
    name: Windows (x86_64)
    if: ${{ (github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'vxn-1b-')) || (github.event_name == 'workflow_dispatch' && inputs.line == 'vxn-1+vxn-2') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Build CLAP + VST3 bundles
        working-directory: vxn-1
        run: cargo xtask bundle --release --format clap,vst3

      # Guard against the /WHOLEARCHIVE class of failure: a VST3 whose Rust
      # staticlib never got force-loaded still LINKS, and still produces a
      # plausible bundle — it just has an empty factory. Nothing downstream
      # notices, so assert the engine is actually in there. Shipped broken on
      # Windows in VXN1/VXN2 0.1.1 and VXN1b 0.0.1 before this check existed.
      # CLAP first, and attached before the VST3 is verified: the two formats are
      # independent artifacts, and a VST3 that failed to absorb the staticlib is
      # no reason to withhold a CLAP that built fine. (The first cut of this
      # guard gated both, and a VST3 failure shipped a release with no Windows
      # binaries at all.)
      - name: Package and attach the CLAP
        run: Copy-Item target/bundled/VXN1.clap VXN1-windows-x64.clap

      - name: Attach CLAP to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: VXN1-windows-x64.clap

      - name: Verify the VST3 embeds the engine
        shell: pwsh
        run: |
          $bin = "target/bundled/VXN1.vst3/Contents/x86_64-win/VXN1.vst3"
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($bin))
          if ($text -notmatch [regex]::Escape('labs.vulpus.vxn1')) {
            Write-Output "::error::VXN1.vst3 does not contain labs.vulpus.vxn1 — the staticlib was not force-loaded"
            exit 1
          }
          Write-Output "ok: VXN1.vst3 embeds labs.vulpus.vxn1 ($((Get-Item $bin).Length) bytes)"

      - name: Package and attach the VST3
        run: Compress-Archive -Path target/bundled/VXN1.vst3 -DestinationPath VXN1-windows-x64.vst3.zip

      - name: Attach VST3 to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: VXN1-windows-x64.vst3.zip

  macos-vxn2:
    name: macOS vxn-2 (universal)
    if: ${{ (github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'vxn-1b-')) || (github.event_name == 'workflow_dispatch' && inputs.line == 'vxn-1+vxn-2') }}
    runs-on: macos-14
    steps:
      # Submodules (clap-wrapper + vst3sdk) are needed for the VST3 build.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install Ninja
        run: brew install ninja

      - name: Build universal VXN2 CLAP + VST3 bundles
        working-directory: vxn-2
        run: cargo xtask bundle --release --format clap,vst3 --universal

      # Guard against the /WHOLEARCHIVE class of failure: a VST3 whose Rust
      # staticlib never got force-loaded still LINKS, and still produces a
      # plausible bundle — it just has an empty factory. Nothing downstream
      # notices, so assert the engine is actually in there. Shipped broken on
      # Windows in VXN1/VXN2 0.1.1 and VXN1b 0.0.1 before this check existed.
      # CLAP first, and attached before the VST3 is verified: the two formats are
      # independent artifacts, and a VST3 that failed to absorb the staticlib is
      # no reason to withhold a CLAP that built fine. (The first cut of this
      # guard gated both, and a VST3 failure shipped a release with no Windows
      # binaries at all.)
      - name: Zip and attach the CLAP
        run: ditto -c -k --keepParent target/bundled/VXN2.clap VXN2-macOS-universal.clap.zip

      - name: Attach CLAP to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: VXN2-macOS-universal.clap.zip

      - name: Verify the VST3 embeds the engine
        run: |
          BIN=target/bundled/VXN2.vst3/Contents/MacOS/VXN2
          strings -a "$BIN" | grep -q 'labs.vulpus.vxn2' \
            || { echo "::error::VXN2.vst3 does not contain labs.vulpus.vxn2 — the staticlib was not force-loaded"; exit 1; }
          echo "ok: VXN2.vst3 embeds labs.vulpus.vxn2 ($(stat -f%z "$BIN") bytes)"

      - name: Zip and attach the VST3
        run: ditto -c -k --keepParent target/bundled/VXN2.vst3 VXN2-macOS-universal.vst3.zip

      - name: Attach VST3 to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: VXN2-macOS-universal.vst3.zip

  windows-vxn2:
    name: Windows vxn-2 (x86_64)
    if: ${{ (github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'vxn-1b-')) || (github.event_name == 'workflow_dispatch' && inputs.line == 'vxn-1+vxn-2') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Build VXN2 CLAP + VST3 bundles
        working-directory: vxn-2
        run: cargo xtask bundle --release --format clap,vst3

      # Guard against the /WHOLEARCHIVE class of failure: a VST3 whose Rust
      # staticlib never got force-loaded still LINKS, and still produces a
      # plausible bundle — it just has an empty factory. Nothing downstream
      # notices, so assert the engine is actually in there. Shipped broken on
      # Windows in VXN1/VXN2 0.1.1 and VXN1b 0.0.1 before this check existed.
      # CLAP first, and attached before the VST3 is verified: the two formats are
      # independent artifacts, and a VST3 that failed to absorb the staticlib is
      # no reason to withhold a CLAP that built fine. (The first cut of this
      # guard gated both, and a VST3 failure shipped a release with no Windows
      # binaries at all.)
      - name: Package and attach the CLAP
        run: Copy-Item target/bundled/VXN2.clap VXN2-windows-x64.clap

      - name: Attach CLAP to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: VXN2-windows-x64.clap

      - name: Verify the VST3 embeds the engine
        shell: pwsh
        run: |
          $bin = "target/bundled/VXN2.vst3/Contents/x86_64-win/VXN2.vst3"
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($bin))
          if ($text -notmatch [regex]::Escape('labs.vulpus.vxn2')) {
            Write-Output "::error::VXN2.vst3 does not contain labs.vulpus.vxn2 — the staticlib was not force-loaded"
            exit 1
          }
          Write-Output "ok: VXN2.vst3 embeds labs.vulpus.vxn2 ($((Get-Item $bin).Length) bytes)"

      - name: Package and attach the VST3
        run: Compress-Archive -Path target/bundled/VXN2.vst3 -DestinationPath VXN2-windows-x64.vst3.zip

      - name: Attach VST3 to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: VXN2-windows-x64.vst3.zip

  macos-vxn1b:
    name: macOS vxn-1b (universal)
    if: ${{ (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'vxn-1b-')) || (github.event_name == 'workflow_dispatch' && inputs.line == 'vxn-1b') }}
    runs-on: macos-14
    steps:
      # Submodules (clap-wrapper + vst3sdk) are needed for the VST3 build. They
      # are the repo-root checkouts vxn-1 and vxn-2 share; vxn-1b/wrapper points
      # at the same ones rather than vendoring a third copy.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install Ninja
        run: brew install ninja

      # VXN1b has no `cargo xtask` alias (no per-product .cargo/config.toml), so
      # the xtask package is invoked directly — the same call `deploy.sh` makes.
      # `--release` is a no-op there (the build is always release) and is passed
      # only to keep this line readable against the vxn-1/vxn-2 jobs above.
      - name: Build universal VXN1b CLAP + VST3 bundles
        run: cargo run --package vxn1b-xtask -- bundle --release --format clap,vst3 --universal

      # The macOS .clap/.vst3 are bundle directories; ditto zips them preserving
      # the bundle structure (and resource forks) so they unpack cleanly. The
      # CLAP bundle is lowercase `vxn1b.clap` (the name already installed on
      # users' machines); only the zip around it is capitalised, to match the
      # other products' release assets.
      # Guard against the /WHOLEARCHIVE class of failure: a VST3 whose Rust
      # staticlib never got force-loaded still LINKS, and still produces a
      # plausible bundle — it just has an empty factory. Nothing downstream
      # notices, so assert the engine is actually in there. Shipped broken on
      # Windows in VXN1/VXN2 0.1.1 and VXN1b 0.0.1 before this check existed.
      # CLAP first, and attached before the VST3 is verified: the two formats are
      # independent artifacts, and a VST3 that failed to absorb the staticlib is
      # no reason to withhold a CLAP that built fine. (The first cut of this
      # guard gated both, and a VST3 failure shipped a release with no Windows
      # binaries at all.)
      - name: Zip and attach the CLAP
        run: ditto -c -k --keepParent target/bundled/vxn1b.clap VXN1b-macOS-universal.clap.zip

      - name: Attach CLAP to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: VXN1b-macOS-universal.clap.zip

      - name: Verify the VST3 embeds the engine
        run: |
          BIN=target/bundled/VXN1b.vst3/Contents/MacOS/VXN1b
          strings -a "$BIN" | grep -q 'labs.vulpus.vxn1b' \
            || { echo "::error::VXN1b.vst3 does not contain labs.vulpus.vxn1b — the staticlib was not force-loaded"; exit 1; }
          echo "ok: VXN1b.vst3 embeds labs.vulpus.vxn1b ($(stat -f%z "$BIN") bytes)"

      - name: Zip and attach the VST3
        run: ditto -c -k --keepParent target/bundled/VXN1b.vst3 VXN1b-macOS-universal.vst3.zip

      - name: Attach VST3 to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: VXN1b-macOS-universal.vst3.zip

  windows-vxn1b:
    name: Windows vxn-1b (x86_64)
    if: ${{ (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'vxn-1b-')) || (github.event_name == 'workflow_dispatch' && inputs.line == 'vxn-1b') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Build VXN1b CLAP + VST3 bundles
        run: cargo run --package vxn1b-xtask -- bundle --release --format clap,vst3

      # Diagnostics for the Windows /WHOLEARCHIVE failure. The link succeeds and
      # produces a module with an empty factory, so the only way to see what the
      # linker was actually told is to read the response file back.
      - name: Diagnose the VST3 link
        if: always()
        shell: pwsh
        run: |
          Write-Output "=== staticlib cargo produced ==="
          Get-ChildItem target/release -Filter '*.lib' -ErrorAction SilentlyContinue |
            ForEach-Object { "{0}  {1} bytes" -f $_.Name, $_.Length }
          Write-Output "=== VXN_CLAP_STATIC as CMake cached it ==="
          Select-String -Path target/vxn1b-wrapper-release/CMakeCache.txt `
            -Pattern 'VXN_CLAP_STATIC' -ErrorAction SilentlyContinue |
            ForEach-Object { $_.Line }
          Write-Output "=== link response files mentioning the module ==="
          Get-ChildItem -Recurse target/vxn1b-wrapper-release -Filter '*.rsp' -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Output "--- $($_.FullName)"
              Get-Content $_.FullName | ForEach-Object { $_ -replace ' ', "`n" } |
                Where-Object { $_ -match 'WHOLEARCHIVE|vxn1b_clap|FORCE' }
            }
          Write-Output "=== ninja's own link command ==="
          Select-String -Path target/vxn1b-wrapper-release/build.ninja `
            -Pattern 'WHOLEARCHIVE|vxn1b_clap' -ErrorAction SilentlyContinue |
            ForEach-Object { $_.Line.Substring(0, [Math]::Min(600, $_.Line.Length)) }

      # Guard against the /WHOLEARCHIVE class of failure: a VST3 whose Rust
      # staticlib never got force-loaded still LINKS, and still produces a
      # plausible bundle — it just has an empty factory. Nothing downstream
      # notices, so assert the engine is actually in there. Shipped broken on
      # Windows in VXN1/VXN2 0.1.1 and VXN1b 0.0.1 before this check existed.
      # CLAP first, and attached before the VST3 is verified: the two formats are
      # independent artifacts, and a VST3 that failed to absorb the staticlib is
      # no reason to withhold a CLAP that built fine. (The first cut of this
      # guard gated both, and a VST3 failure shipped a release with no Windows
      # binaries at all.)
      - name: Package and attach the CLAP
        run: Copy-Item target/bundled/vxn1b.clap VXN1b-windows-x64.clap

      - name: Attach CLAP to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: VXN1b-windows-x64.clap

      - name: Verify the VST3 embeds the engine
        shell: pwsh
        run: |
          $bin = "target/bundled/VXN1b.vst3/Contents/x86_64-win/VXN1b.vst3"
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($bin))
          if ($text -notmatch [regex]::Escape('labs.vulpus.vxn1b')) {
            Write-Output "::error::VXN1b.vst3 does not contain labs.vulpus.vxn1b — the staticlib was not force-loaded"
            exit 1
          }
          Write-Output "ok: VXN1b.vst3 embeds labs.vulpus.vxn1b ($((Get-Item $bin).Length) bytes)"

      - name: Package and attach the VST3
        run: Compress-Archive -Path target/bundled/VXN1b.vst3 -DestinationPath VXN1b-windows-x64.vst3.zip

      - name: Attach VST3 to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: VXN1b-windows-x64.vst3.zip

  manual:
    name: Manual (PDF)
    if: ${{ (github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'vxn-1b-')) || (github.event_name == 'workflow_dispatch' && inputs.line == 'vxn-1+vxn-2') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook and mdbook-pandoc
        run: cargo install mdbook mdbook-pandoc --locked

      - name: Install Pandoc
        run: |
          curl -sSL https://github.com/jgm/pandoc/releases/download/3.2/pandoc-3.2-linux-amd64.tar.gz \
            | tar -xz --strip-components=2 --directory /usr/local/bin pandoc-3.2/bin/pandoc

      - name: Install Tectonic
        run: |
          curl -sSL https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz --directory /usr/local/bin

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Write puppeteer config (no-sandbox for CI chromium)
        run: |
          cat > /tmp/puppeteer-config.json <<'EOF'
          { "args": ["--no-sandbox"] }
          EOF

      - name: Render diagrams
        working-directory: vxn-1/docs
        env:
          MMDC_PUPPETEER_CONFIG: /tmp/puppeteer-config.json
        run: ./render-diagrams.sh

      - name: Build manual
        working-directory: vxn-1/docs
        run: mdbook build

      - name: Attach PDF to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: vxn-1/docs/book/pandoc/pdf/vxn1-manual.pdf
