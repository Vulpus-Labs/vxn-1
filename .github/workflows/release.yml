name: Release

# Build the CLAP/VST3 plugins for macOS and Windows and attach the binaries to
# the GitHub Release that triggered the run.
#
# ONE release line. vxn-2 and VXN1b ship together on the bare-semver tag
# matching the workspace version (`0.2.0`), and every published release builds
# both products: four jobs, eight assets, no conditions on the tag name.
#
# It was not always so. Until 0.2.0 the two shipped on separate tag lines —
# vxn-2 on the bare semver, VXN1b on `vxn-1b-<version>` cut with
# `--latest=false` — and every job carried a
# `startsWith(github.event.release.tag_name, 'vxn-1b-')` guard to keep them
# apart. That split is retired: the products are versioned and released as one.
# The old `vxn-1b-*` tags remain as history, and `vxn-1b-0.2.0` is kept as a
# signpost to 0.2.0. Nothing here reads the tag name any more, so were such a
# tag ever cut again it would simply get both products, which is now the
# correct answer.
#
# The lesson that outlived the guards: a job-level `if` cannot read the `env`
# context (only `github`, `needs`, `vars` and `inputs`). An `env.` reference
# there resolves to the empty string rather than erroring — so a hoisted
# predicate fails silently, and in the direction that looks like it works.
# `inputs` IS readable, which is what the dispatch conditions below rely on.
#
# `workflow_dispatch` runs the same builds WITHOUT a release: every attach step
# is gated on the event being a real release, so a dispatch is build-and-verify
# only. Use it to prove a packaging or link change before cutting a tag — the
# Windows VST3 link bug (see the verify steps below) shipped three times because
# there was no way to exercise this workflow except by publishing. Its `line`
# input no longer selects a release line (there is one); it only narrows which
# product to build, so a packaging fix to one need not wait on the other.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      line:
        description: "Which product(s) to build (dispatch only — releases always build both)"
        required: true
        default: all
        type: choice
        options: [all, vxn-2, vxn-1b]

permissions:
  contents: write

jobs:
  macos-vxn2:
    name: macOS vxn-2 (universal)
    if: ${{ github.event_name == 'release' || inputs.line == 'all' || inputs.line == 'vxn-2' }}
    runs-on: macos-14
    steps:
      # Submodules (clap-wrapper + vst3sdk) are needed for the VST3 build.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install Ninja
        run: brew install ninja

      - name: Build universal VXN2 CLAP + VST3 bundles
        working-directory: vxn-2
        run: cargo xtask bundle --release --format clap,vst3 --universal

      # Guard against the /WHOLEARCHIVE class of failure: a VST3 whose Rust
      # staticlib never got force-loaded still LINKS, and still produces a
      # plausible bundle — it just has an empty factory. Nothing downstream
      # notices, so assert the engine is actually in there. Shipped broken on
      # Windows in VXN1/VXN2 0.1.1 and VXN1b 0.0.1 before this check existed.
      # CLAP first, and attached before the VST3 is verified: the two formats are
      # independent artifacts, and a VST3 that failed to absorb the staticlib is
      # no reason to withhold a CLAP that built fine. (The first cut of this
      # guard gated both, and a VST3 failure shipped a release with no Windows
      # binaries at all.)
      # Every macOS bundle must be code-signed and validate. Not cosmetic: on
      # Apple Silicon the linker ad-hoc signs the arm64 slice only, so a
      # universal bundle ships with an unsigned x86_64 slice and — because
      # nothing writes Contents/_CodeSignature — no resource seal at all.
      # `codesign --verify` then fails, and a host that validates before
      # loading rejects the plugin outright. Ableton's scanner logs it as
      # "not a plugin", which is indistinguishable from never having found it.
      # All eight macOS assets of 0.3.0 shipped this way, both formats, both
      # products; `vxn-xtask-common`'s bundler now signs, and this asserts it
      # actually happened rather than trusting that it did.
      - name: Verify the VXN2 CLAP is signed
        run: |
          B=target/bundled/VXN2.clap
          codesign --verify --verbose=2 "$B" \
            || { echo "::error::VXN2.clap failed code-signature validation"; exit 1; }
          test -d "$B/Contents/_CodeSignature" \
            || { echo "::error::VXN2.clap has no _CodeSignature — the resource seal is missing"; exit 1; }
          for A in arm64 x86_64; do
            codesign -dvv --arch $A "$B" 2>&1 | grep -q 'Signature=' \
              || { echo "::error::VXN2.clap $A slice is unsigned"; exit 1; }
          done
          echo "ok: VXN2.clap signed and sealed (arm64 + x86_64)"

      - name: Zip and attach the CLAP
        run: ditto -c -k --keepParent target/bundled/VXN2.clap VXN2-macOS-universal.clap.zip

      - name: Attach CLAP to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: VXN2-macOS-universal.clap.zip

      - name: Verify the VST3 embeds the engine
        run: |
          BIN=target/bundled/VXN2.vst3/Contents/MacOS/VXN2
          strings -a "$BIN" | grep -q 'labs.vulpus.vxn2' \
            || { echo "::error::VXN2.vst3 does not contain labs.vulpus.vxn2 — the staticlib was not force-loaded"; exit 1; }
          echo "ok: VXN2.vst3 embeds labs.vulpus.vxn2 ($(stat -f%z "$BIN") bytes)"

      # Every macOS bundle must be code-signed and validate. Not cosmetic: on
      # Apple Silicon the linker ad-hoc signs the arm64 slice only, so a
      # universal bundle ships with an unsigned x86_64 slice and — because
      # nothing writes Contents/_CodeSignature — no resource seal at all.
      # `codesign --verify` then fails, and a host that validates before
      # loading rejects the plugin outright. Ableton's scanner logs it as
      # "not a plugin", which is indistinguishable from never having found it.
      # All eight macOS assets of 0.3.0 shipped this way, both formats, both
      # products; `vxn-xtask-common`'s bundler now signs, and this asserts it
      # actually happened rather than trusting that it did.
      - name: Verify the VXN2 VST3 is signed
        run: |
          B=target/bundled/VXN2.vst3
          codesign --verify --verbose=2 "$B" \
            || { echo "::error::VXN2.vst3 failed code-signature validation"; exit 1; }
          test -d "$B/Contents/_CodeSignature" \
            || { echo "::error::VXN2.vst3 has no _CodeSignature — the resource seal is missing"; exit 1; }
          for A in arm64 x86_64; do
            codesign -dvv --arch $A "$B" 2>&1 | grep -q 'Signature=' \
              || { echo "::error::VXN2.vst3 $A slice is unsigned"; exit 1; }
          done
          echo "ok: VXN2.vst3 signed and sealed (arm64 + x86_64)"

      - name: Zip and attach the VST3
        run: ditto -c -k --keepParent target/bundled/VXN2.vst3 VXN2-macOS-universal.vst3.zip

      - name: Attach VST3 to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: VXN2-macOS-universal.vst3.zip

  windows-vxn2:
    name: Windows vxn-2 (x86_64)
    if: ${{ github.event_name == 'release' || inputs.line == 'all' || inputs.line == 'vxn-2' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Build VXN2 CLAP + VST3 bundles
        working-directory: vxn-2
        run: cargo xtask bundle --release --format clap,vst3

      # Guard against the /WHOLEARCHIVE class of failure: a VST3 whose Rust
      # staticlib never got force-loaded still LINKS, and still produces a
      # plausible bundle — it just has an empty factory. Nothing downstream
      # notices, so assert the engine is actually in there. Shipped broken on
      # Windows in VXN1/VXN2 0.1.1 and VXN1b 0.0.1 before this check existed.
      # CLAP first, and attached before the VST3 is verified: the two formats are
      # independent artifacts, and a VST3 that failed to absorb the staticlib is
      # no reason to withhold a CLAP that built fine. (The first cut of this
      # guard gated both, and a VST3 failure shipped a release with no Windows
      # binaries at all.)
      - name: Package and attach the CLAP
        run: Copy-Item target/bundled/VXN2.clap VXN2-windows-x64.clap

      - name: Attach CLAP to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: VXN2-windows-x64.clap

      - name: Verify the VST3 embeds the engine
        shell: pwsh
        run: |
          $bin = "target/bundled/VXN2.vst3/Contents/x86_64-win/VXN2.vst3"
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($bin))
          if ($text -notmatch [regex]::Escape('labs.vulpus.vxn2')) {
            Write-Output "::error::VXN2.vst3 does not contain labs.vulpus.vxn2 — the staticlib was not force-loaded"
            exit 1
          }
          Write-Output "ok: VXN2.vst3 embeds labs.vulpus.vxn2 ($((Get-Item $bin).Length) bytes)"

      - name: Package and attach the VST3
        run: Compress-Archive -Path target/bundled/VXN2.vst3 -DestinationPath VXN2-windows-x64.vst3.zip

      - name: Attach VST3 to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: VXN2-windows-x64.vst3.zip

  macos-vxn1b:
    name: macOS vxn-1b (universal)
    if: ${{ github.event_name == 'release' || inputs.line == 'all' || inputs.line == 'vxn-1b' }}
    runs-on: macos-14
    steps:
      # Submodules (clap-wrapper + vst3sdk) are needed for the VST3 build. They
      # are the repo-root checkouts vxn-1 and vxn-2 share; vxn-1b/wrapper points
      # at the same ones rather than vendoring a third copy.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install Ninja
        run: brew install ninja

      # VXN1b has no `cargo xtask` alias (no per-product .cargo/config.toml), so
      # the xtask package is invoked directly — the same call `deploy.sh` makes.
      # No `--release`: the build is always release, and the flag was a no-op
      # carried only to make this line scan like the vxn-2 jobs above.
      - name: Build universal VXN1b CLAP + VST3 bundles
        run: cargo run --package vxn1b-xtask -- bundle --format clap,vst3 --universal

      # The macOS .clap/.vst3 are bundle directories; ditto zips them preserving
      # the bundle structure (and resource forks) so they unpack cleanly. The
      # CLAP bundle is lowercase `vxn1b.clap` (the name already installed on
      # users' machines); only the zip around it is capitalised, to match the
      # other products' release assets.
      # Guard against the /WHOLEARCHIVE class of failure: a VST3 whose Rust
      # staticlib never got force-loaded still LINKS, and still produces a
      # plausible bundle — it just has an empty factory. Nothing downstream
      # notices, so assert the engine is actually in there. Shipped broken on
      # Windows in VXN1/VXN2 0.1.1 and VXN1b 0.0.1 before this check existed.
      # CLAP first, and attached before the VST3 is verified: the two formats are
      # independent artifacts, and a VST3 that failed to absorb the staticlib is
      # no reason to withhold a CLAP that built fine. (The first cut of this
      # guard gated both, and a VST3 failure shipped a release with no Windows
      # binaries at all.)
      # Every macOS bundle must be code-signed and validate. Not cosmetic: on
      # Apple Silicon the linker ad-hoc signs the arm64 slice only, so a
      # universal bundle ships with an unsigned x86_64 slice and — because
      # nothing writes Contents/_CodeSignature — no resource seal at all.
      # `codesign --verify` then fails, and a host that validates before
      # loading rejects the plugin outright. Ableton's scanner logs it as
      # "not a plugin", which is indistinguishable from never having found it.
      # All eight macOS assets of 0.3.0 shipped this way, both formats, both
      # products; `vxn-xtask-common`'s bundler now signs, and this asserts it
      # actually happened rather than trusting that it did.
      - name: Verify the VXN1b CLAP is signed
        run: |
          B=target/bundled/vxn1b.clap
          codesign --verify --verbose=2 "$B" \
            || { echo "::error::vxn1b.clap failed code-signature validation"; exit 1; }
          test -d "$B/Contents/_CodeSignature" \
            || { echo "::error::vxn1b.clap has no _CodeSignature — the resource seal is missing"; exit 1; }
          for A in arm64 x86_64; do
            codesign -dvv --arch $A "$B" 2>&1 | grep -q 'Signature=' \
              || { echo "::error::vxn1b.clap $A slice is unsigned"; exit 1; }
          done
          echo "ok: vxn1b.clap signed and sealed (arm64 + x86_64)"

      - name: Zip and attach the CLAP
        run: ditto -c -k --keepParent target/bundled/vxn1b.clap VXN1b-macOS-universal.clap.zip

      - name: Attach CLAP to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: VXN1b-macOS-universal.clap.zip

      - name: Verify the VST3 embeds the engine
        run: |
          BIN=target/bundled/VXN1b.vst3/Contents/MacOS/VXN1b
          strings -a "$BIN" | grep -q 'labs.vulpus.vxn1b' \
            || { echo "::error::VXN1b.vst3 does not contain labs.vulpus.vxn1b — the staticlib was not force-loaded"; exit 1; }
          echo "ok: VXN1b.vst3 embeds labs.vulpus.vxn1b ($(stat -f%z "$BIN") bytes)"

      # Every macOS bundle must be code-signed and validate. Not cosmetic: on
      # Apple Silicon the linker ad-hoc signs the arm64 slice only, so a
      # universal bundle ships with an unsigned x86_64 slice and — because
      # nothing writes Contents/_CodeSignature — no resource seal at all.
      # `codesign --verify` then fails, and a host that validates before
      # loading rejects the plugin outright. Ableton's scanner logs it as
      # "not a plugin", which is indistinguishable from never having found it.
      # All eight macOS assets of 0.3.0 shipped this way, both formats, both
      # products; `vxn-xtask-common`'s bundler now signs, and this asserts it
      # actually happened rather than trusting that it did.
      - name: Verify the VXN1b VST3 is signed
        run: |
          B=target/bundled/VXN1b.vst3
          codesign --verify --verbose=2 "$B" \
            || { echo "::error::VXN1b.vst3 failed code-signature validation"; exit 1; }
          test -d "$B/Contents/_CodeSignature" \
            || { echo "::error::VXN1b.vst3 has no _CodeSignature — the resource seal is missing"; exit 1; }
          for A in arm64 x86_64; do
            codesign -dvv --arch $A "$B" 2>&1 | grep -q 'Signature=' \
              || { echo "::error::VXN1b.vst3 $A slice is unsigned"; exit 1; }
          done
          echo "ok: VXN1b.vst3 signed and sealed (arm64 + x86_64)"

      - name: Zip and attach the VST3
        run: ditto -c -k --keepParent target/bundled/VXN1b.vst3 VXN1b-macOS-universal.vst3.zip

      - name: Attach VST3 to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: VXN1b-macOS-universal.vst3.zip

  windows-vxn1b:
    name: Windows vxn-1b (x86_64)
    if: ${{ github.event_name == 'release' || inputs.line == 'all' || inputs.line == 'vxn-1b' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Build VXN1b CLAP + VST3 bundles
        run: cargo run --package vxn1b-xtask -- bundle --format clap,vst3

      # CLAP first, and attached before the VST3 is verified: the two formats are
      # independent artifacts, and a VST3 that failed to absorb the staticlib is
      # no reason to withhold a CLAP that built fine. (The first cut of this
      # guard gated both, and a VST3 failure shipped a release with no Windows
      # binaries at all.)
      - name: Package and attach the CLAP
        run: Copy-Item target/bundled/vxn1b.clap VXN1b-windows-x64.clap

      - name: Attach CLAP to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: VXN1b-windows-x64.clap

      - name: Verify the VST3 embeds the engine
        shell: pwsh
        run: |
          $bin = "target/bundled/VXN1b.vst3/Contents/x86_64-win/VXN1b.vst3"
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($bin))
          if ($text -notmatch [regex]::Escape('labs.vulpus.vxn1b')) {
            Write-Output "::error::VXN1b.vst3 does not contain labs.vulpus.vxn1b — the staticlib was not force-loaded"
            exit 1
          }
          Write-Output "ok: VXN1b.vst3 embeds labs.vulpus.vxn1b ($((Get-Item $bin).Length) bytes)"

      - name: Package and attach the VST3
        run: Compress-Archive -Path target/bundled/VXN1b.vst3 -DestinationPath VXN1b-windows-x64.vst3.zip

      - name: Attach VST3 to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: VXN1b-windows-x64.vst3.zip
