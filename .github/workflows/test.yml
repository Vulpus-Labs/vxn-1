name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. force-push to a PR branch).
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Workspace tests (macOS)
    # macOS is the primary dev/runtime target: NEON paths compile and run,
    # the xtask bundler is macOS-only, and editor_smoke.rs is macOS-gated.
    # Pinned (not macos-latest) because baseline.rs's render-hash golden folds
    # the macOS system libm, which changes across OS majors — an image bump
    # would flip the hash with no code change. Re-capture EXPECTED if bumped.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # No `targets:` here — rust-toolchain.toml pins the channel and carries the
      # target list, so anything named here lands on a toolchain cargo will not use.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # Node for vxn-1b's faceplate Vitest suite (jsdom) and its `node --test`
      # web-transport suite. vxn-2 ui-web has no JS test suite yet. (vxn-1's
      # assets dir went with its retirement, 2026-08-27.)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            vxn-1b/crates/vxn1b-ui-web/assets/package-lock.json

      - name: Install JS deps (vxn-1b)
        working-directory: vxn-1b/crates/vxn1b-ui-web/assets
        run: npm ci

      # `--workspace` covers vxn-core-*, vxn-1b, vxn-2 and vxn-3 in a single
      # invocation (flat workspace, E001). `archive/vxn-1` is deliberately NOT a
      # member and is not expected to compile. VXN_JS_TESTS=1 un-gates the
      # `js_suite_passes` test in vxn1b-ui-web, which shells `npm test`.
      # VXN_RENDER_HASH=1 un-gates baseline.rs's render-hash canary, which is
      # environment-locked to this pinned runner (macos-15) + rustc.
      - name: cargo test --workspace
        env:
          VXN_JS_TESTS: "1"
          VXN_RENDER_HASH: "1"
        run: cargo test --workspace

      # vxn-1b's web transport (event ring, codec, coordinator, controller,
      # telemetry, persistence, faceplate bridge) is tested by `node --test`
      # rather than Vitest — no jsdom, and several suites drive the REAL wasm.
      # They FAIL rather than skip when an artifact is missing (0295), so the
      # build must come first.
      #
      # `xtask web` rather than hand-listing cargo builds: there are TWO wasm
      # crates (vxn1b-wasm and vxn1b-web-controller) and the first cut of this
      # step built only the first. CI then reported 91 passing tests against a
      # full suite well over half as large again — three suites aborted on the
      # missing controller artifact and the step still looked plausible. xtask
      # owns the list, so a third crate cannot silently fall out of it (0321).
      - name: Build vxn-1b web artifacts
        run: cargo run --package vxn1b-xtask -- web

      - name: vxn-1b web suite (node --test)
        run: node --test vxn-1b/crates/vxn1b-wasm/web/*.test.mjs

      # Bench code is compile-checked only — running criterion in CI is noise,
      # but bit-rotted bench code should fail the build (vxn-2 ticket 0070).
      - name: cargo bench --no-run
        run: cargo bench --no-run --workspace
