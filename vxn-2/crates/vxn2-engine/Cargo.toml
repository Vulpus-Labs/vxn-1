[package]
name = "vxn2-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
vxn2-dsp = { workspace = true }
vxn-core-dsp = { workspace = true }
vxn-core-app = { workspace = true }
vxn-core-utils = { workspace = true }
# Shared mod-matrix routing (ADR 0003 / epic E049): the polarity/shape axes,
# the `matrix_enum!` generator behind every name/label table, the flat curve
# codec and the scale VCA.
vxn-core-matrix = { workspace = true }
vxn2-app = { workspace = true }
# Shared sparse-TOML preset scaffold (Meta/PresetError/Header/SCHEMA/value_for,
# ticket 0143). Only the synth-specific body types stay here.
vxn-preset = { workspace = true }
# Preset format (E007 lineage): name-keyed TOML, sparse-vs-descriptor-default.
# Main-thread only — the audio path never touches serde/toml. `include_dir`
# bakes the factory bank into the binary at compile time.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
include_dir = "0.7"

[dev-dependencies]
# `vxn_core_matrix::golden` — the shared golden-vector table (0331). The
# `testing` feature exposes it (and the synthetic roster it is written against)
# outside the crate's own unit tests; declaring it here rather than above keeps
# it out of every shipped binary, and costs no extra compile because the engine
# already depends on the crate.
vxn-core-matrix = { workspace = true, features = ["testing"] }
