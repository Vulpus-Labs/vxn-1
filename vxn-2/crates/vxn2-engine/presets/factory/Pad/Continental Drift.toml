schema = 1

[meta]
name = "Continental Drift"
author = "Vulpus Labs"
category = "Pad"
comment = "Nothing here happens quickly. The mod-env takes three seconds to reach the filter and four more to settle, so the harmonics arrive long after the note does and a held chord is still changing shape ten seconds in. Eight lanes at wide detune; LFO1 breathes the reverb send so even the space moves."

[params]
algo = 2
feedback = 2.49

# Carriers 1 and 4 — very slow attack, full sustain, long tail.
op1-eg-r1 = 26
op1-eg-r2 = 30
op1-eg-l2 = 96
op1-eg-l3 = 94
op1-eg-r4 = 20
op1-ks-r-depth = 6

op2-level = 76
op2-eg-r1 = 22
op2-eg-r2 = 28
op2-eg-l2 = 88
op2-eg-l3 = 84
op2-eg-r4 = 18

op3-num = 3
op3-level = 88
op3-eg-r1 = 20
op3-eg-l2 = 70
op3-eg-l3 = 64
op3-eg-r4 = 18

op4-num = 2
op4-level = 88
op4-detune = -7
op4-eg-r1 = 24
op4-eg-r2 = 30
op4-eg-l2 = 92
op4-eg-l3 = 88
op4-eg-r4 = 20
op4-ks-r-depth = 10

op5-num = 3
op5-level = 68
op5-detune = 5
op5-eg-r1 = 22
op5-eg-l2 = 84
op5-eg-l3 = 78
op5-eg-r4 = 18

op6-num = 5
op6-level = 54
op6-eg-r1 = 20
op6-eg-l2 = 78
op6-eg-l3 = 70
op6-eg-r4 = 18

# The filter is the slowest thing in the patch.
filter-enable = true
filter-cutoff = 320.0
filter-resonance = 0.20
filter-slope = "4-Pole"
filter-drive = 1.4
filter-keytrack = 0.25

mod-env-a = 3000.0
mod-env-d = 4000.0
mod-env-s = 0.72
mod-env-r = 2600.0

lfo1-shape = "Sine"
lfo1-rate = 0.09

stack-density = 8
stack-detune = 14.0
stack-spread = 1.0
stack-distrib = "Geometric"

reverb-on = true
reverb-size = 0.9
reverb-decay = 8.0
reverb-damp = 0.4
reverb-mix = 0.42

delay-on = true
delay-time = 620.0
delay-sync = false
delay-feedback = 0.5
delay-mix = 0.18
delay-pingpong = true

master-volume = -17.23
[[matrix]]
slot = 0
source = "mod-env"
dest = "cutoff"
curve = "lin"
depth = 0.68

[[matrix]]
slot = 1
source = "lfo1"
dest = "reverb-mix"
curve = "lin"
depth = 0.18

[[matrix]]
slot = 2
source = "voice-spread"
dest = "op1-pan"
curve = "lin"
depth = 1.0

[[matrix]]
slot = 3
source = "voice-spread"
dest = "op4-pan"
curve = "lin"
depth = -1.0

[[matrix]]
slot = 4
source = "voice-rand"
dest = "op1-phase"
curve = "lin"
depth = 1.0

[[matrix]]
slot = 5
source = "voice-rand"
dest = "op4-phase"
curve = "lin"
depth = 1.0
