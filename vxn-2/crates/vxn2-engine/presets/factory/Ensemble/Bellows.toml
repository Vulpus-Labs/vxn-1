schema = 1

[meta]
name = "Bellows"
author = "Vulpus Labs"
category = "Ensemble"
comment = "Accordion, tuned musette. Three lanes at 18 cents is far too wide for a chorus and exactly right for a reed bank — the beating is the instrument, not an effect. Reeds have no attack transient worth speaking of and no decay at all, so every envelope here is a rectangle: on while the key is down, off when it is not."

[params]
algo = 32
feedback = 1.26

# Six reeds, all carriers, odd-weighted for the buzzy free-reed spectrum.
op1-eg-r1 = 78
op1-eg-l2 = 99
op1-eg-l3 = 99
op1-eg-r4 = 84

op2-num = 2
op2-level = 68
op2-eg-r1 = 78
op2-eg-l2 = 99
op2-eg-l3 = 99
op2-eg-r4 = 84

op3-num = 3
op3-level = 80
op3-eg-r1 = 76
op3-eg-l2 = 99
op3-eg-l3 = 99
op3-eg-r4 = 84

op4-num = 4
op4-level = 52
op4-eg-r1 = 76
op4-eg-l2 = 99
op4-eg-l3 = 99
op4-eg-r4 = 84

op5-num = 5
op5-level = 62
op5-eg-r1 = 74
op5-eg-l2 = 99
op5-eg-l3 = 99
op5-eg-r4 = 84

op6-num = 7
op6-level = 46
op6-eg-r1 = 74
op6-eg-l2 = 99
op6-eg-l3 = 99
op6-eg-r4 = 84

filter-enable = true
filter-cutoff = 3000.0
filter-resonance = 0.16
filter-slope = "2-Pole"
filter-drive = 1.6
filter-keytrack = 0.40

hp-cutoff = 80.0

# Musette: wide, deliberate, linear so all three reeds are evenly apart.
stack-density = 3
stack-detune = 18.0
stack-spread = 0.6
stack-distrib = "Linear"

reverb-on = true
reverb-size = 0.5
reverb-decay = 1.8
reverb-mix = 0.18

master-volume = -12.95
[[matrix]]
slot = 0
source = "key"
dest = "op6-level"
curve = "lin"
depth = 0.30

[[matrix]]
slot = 1
source = "velocity"
dest = "cutoff"
curve = "lin"
depth = 0.28

[[matrix]]
slot = 2
source = "voice-spread"
dest = "op1-pan"
curve = "lin"
depth = 0.6

[[matrix]]
slot = 3
source = "voice-spread"
dest = "op3-pan"
curve = "lin"
depth = -0.6
