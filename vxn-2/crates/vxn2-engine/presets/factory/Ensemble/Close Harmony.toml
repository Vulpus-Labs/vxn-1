schema = 1

[meta]
name = "Close Harmony"
author = "Vulpus Labs"
category = "Ensemble"
comment = "A tight vocal section rather than a cathedral choir — four lanes, narrow detune, dry enough to sit in a mix. Two operators run in fixed-frequency mode at 700 and 1150 Hz, so those formants stay put as the pitch moves, which is what makes it read as a vowel instead of a synth pad. Key position opens the filter so the top of the range stays bright."

[params]
algo = 22
feedback = 2.49

op1-eg-r1 = 58
op1-eg-r2 = 44
op1-eg-l2 = 92
op1-eg-l3 = 88
op1-eg-r4 = 52
op1-vel-sens = 4
op1-ks-r-depth = 12

op2-level = 80
op2-eg-r1 = 56
op2-eg-l2 = 88
op2-eg-l3 = 84
op2-eg-r4 = 52

# Fixed formants — stationary in Hz, so they behave like a vocal tract.
op3-ratio-mode = "Fixed"
op3-fixed-hz = 700.0
op3-level = 90
op3-eg-r1 = 56
op3-eg-l2 = 84
op3-eg-l3 = 76
op3-eg-r4 = 50

op4-ratio-mode = "Fixed"
op4-fixed-hz = 1150.0
op4-level = 86
op4-eg-r1 = 54
op4-eg-l2 = 78
op4-eg-l3 = 68
op4-eg-r4 = 50

op5-num = 2
op5-level = 88
op5-detune = -6
op5-eg-r1 = 56
op5-eg-l2 = 82
op5-eg-l3 = 74
op5-eg-r4 = 52

# op6 fans across carriers 3, 4 and 5 and carries the feedback.
op6-num = 3
op6-level = 64
op6-eg-r1 = 54
op6-eg-l2 = 84
op6-eg-l3 = 78
op6-eg-r4 = 52

filter-enable = true
filter-cutoff = 1900.0
filter-resonance = 0.14
filter-slope = "2-Pole"
filter-keytrack = 0.40

lfo2-shape = "Sine"
lfo2-rate = 5.2
lfo2-delay = 600.0
lfo2-fade = 800.0

stack-density = 4
stack-detune = 7.0
stack-spread = 0.8
stack-distrib = "Linear"

reverb-on = true
reverb-size = 0.6
reverb-decay = 2.2
reverb-damp = 0.5
reverb-mix = 0.22

master-volume = -8.90
[[matrix]]
slot = 0
source = "key"
dest = "cutoff"
curve = "lin"
depth = 0.35

[[matrix]]
slot = 1
source = "lfo2"
dest = "global-pitch"
curve = "lin"
depth = 0.014

[[matrix]]
slot = 2
source = "aftertouch"
dest = "op6-level"
curve = "lin"
depth = 0.38

[[matrix]]
slot = 3
source = "voice-spread"
dest = "op1-pan"
curve = "lin"
depth = 0.75

[[matrix]]
slot = 4
source = "voice-spread"
dest = "op5-pan"
curve = "lin"
depth = -0.75

[[matrix]]
slot = 5
source = "voice-rand"
dest = "op1-phase"
curve = "lin"
depth = 1.0
