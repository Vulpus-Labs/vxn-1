schema = 1

[meta]
name = "Snapback"
author = "Vulpus Labs"
category = "Pluck"
comment = "Pizzicato: the string is stopped almost before it sounds. Every envelope in the patch is gone inside 200 ms and the release is faster still, so held notes and staccato notes are the same length. A resonant low-pass with a near-instant mod-env blip supplies the snap; velocity is wired to the blip depth, not to level."

[params]
algo = 5
feedback = 2.85

op1-eg-r1 = 99
op1-eg-r2 = 88
op1-eg-l2 = 28
op1-eg-l3 = 0
op1-eg-r3 = 82
op1-eg-r4 = 95
op1-vel-sens = 4

op2-num = 4
op2-level = 62
op2-vel-sens = 6
op2-eg-r1 = 99
op2-eg-r2 = 94
op2-eg-l2 = 10
op2-eg-l3 = 0
op2-eg-r4 = 96

op3-num = 2
op3-level = 84
op3-eg-r1 = 99
op3-eg-r2 = 90
op3-eg-l2 = 22
op3-eg-l3 = 0
op3-eg-r3 = 84
op3-eg-r4 = 95
op3-ks-r-depth = 40

op4-num = 7
op4-level = 50
op4-vel-sens = 7
op4-eg-r1 = 99
op4-eg-r2 = 96
op4-eg-l2 = 8
op4-eg-l3 = 0
op4-eg-r4 = 97

op5-num = 3
op5-level = 58
op5-eg-r1 = 99
op5-eg-r2 = 92
op5-eg-l2 = 16
op5-eg-l3 = 0
op5-eg-r4 = 96

op6-num = 9
op6-level = 36
op6-eg-r1 = 99
op6-eg-r2 = 97
op6-eg-l2 = 6
op6-eg-l3 = 0

filter-enable = true
filter-cutoff = 700.0
filter-resonance = 0.58
filter-slope = "4-Pole"
filter-drive = 2.4
filter-keytrack = 0.70

mod-env-a = 0.0
mod-env-d = 70.0
mod-env-s = 0.0
mod-env-r = 50.0

hp-cutoff = 70.0

reverb-on = true
reverb-size = 0.35
reverb-decay = 1.1
reverb-mix = 0.14

master-volume = -7.90
[[matrix]]
slot = 0
source = "mod-env"
dest = "cutoff"
curve = "exp"
depth = 0.60

[[matrix]]
slot = 1
source = "velocity"
dest = "cutoff"
curve = "lin"
depth = 0.38

[[matrix]]
slot = 2
source = "velocity"
dest = "op4-level"
curve = "lin"
depth = 0.40
