schema = 1

[meta]
name = "Tar Pit"
author = "Vulpus Labs"
category = "Bass"
comment = "Slow, thick and overdriven. Algo 17 puts the feedback on op2 where it smears the modulator rather than the carrier, and the ladder runs at drive 8 so the filter itself is the distortion. Aftertouch opens the cutoff — lean on a held note and it surfaces."

[params]
algo = 17
feedback = 6.49

op1-eg-r1 = 88
op1-eg-r2 = 48
op1-eg-l2 = 95
op1-eg-l3 = 90
op1-eg-r4 = 58
op1-ks-r-depth = 6

# op2 carries the feedback loop — the source of the growl.
op2-level = 84
op2-vel-sens = 4
op2-eg-r1 = 84
op2-eg-r2 = 44
op2-eg-l2 = 88
op2-eg-l3 = 84
op2-eg-r4 = 62

op3-num = 2
op3-level = 74
op3-eg-r1 = 86
op3-eg-l2 = 86
op3-eg-l3 = 82

op4-num = 1
op4-denom = 2
op4-level = 64
op4-eg-r1 = 80
op4-eg-l2 = 86
op4-eg-l3 = 82

op5-num = 3
op5-level = 54
op5-eg-r2 = 70
op5-eg-l2 = 84
op5-eg-l3 = 78

op6-num = 6
op6-level = 42
op6-eg-r2 = 78
op6-eg-l2 = 82
op6-eg-l3 = 74

filter-enable = true
filter-cutoff = 260.0
filter-resonance = 0.18
filter-slope = "4-Pole"
filter-drive = 8.0
filter-keytrack = 0.30

hp-cutoff = 26.0

master-volume = -23.20
[[matrix]]
slot = 0
source = "aftertouch"
dest = "cutoff"
curve = "lin"
depth = 0.52

[[matrix]]
slot = 1
source = "velocity"
dest = "op2-level"
curve = "lin"
depth = 0.28

[[matrix]]
slot = 2
source = "aftertouch"
dest = "filter-drive"
curve = "lin"
depth = 0.30
