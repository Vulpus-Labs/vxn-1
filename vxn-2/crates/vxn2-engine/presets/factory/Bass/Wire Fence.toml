schema = 1

[meta]
name = "Wire Fence"
author = "Vulpus Labs"
category = "Bass"
comment = "Bright, taut, metallic. Algo 22 fans one modulator across three carriers at once, so a single index control brightens the whole stack coherently — the clang stays in tune with itself. Two detuned lanes panned apart give it width without turning it to mush in mono."

[params]
algo = 22
feedback = 4.68

# Carriers 1, 3, 4, 5 — 1 and 3 an octave apart, 4/5 the metallic pair.
op1-eg-r1 = 99
op1-eg-r2 = 64
op1-eg-l2 = 78
op1-eg-l3 = 68
op1-eg-r4 = 76
op1-ks-r-depth = 10

op3-num = 2
op3-level = 78
op3-eg-r1 = 99
op3-eg-r2 = 70
op3-eg-l2 = 62
op3-eg-l3 = 48
op3-eg-r4 = 78

op4-num = 5
op4-denom = 2
op4-level = 52
op4-eg-r1 = 99
op4-eg-r2 = 84
op4-eg-l2 = 32
op4-eg-l3 = 14
op4-eg-r4 = 84

op5-num = 7
op5-denom = 2
op5-level = 44
op5-detune = 6
op5-eg-r1 = 99
op5-eg-r2 = 88
op5-eg-l2 = 24
op5-eg-l3 = 8
op5-eg-r4 = 86

# op2 -> op1 only; op6 fans out to 3, 4 and 5 and carries the feedback.
op2-level = 62
op2-vel-sens = 5
op2-eg-r2 = 76
op2-eg-l2 = 42
op2-eg-l3 = 26

op6-num = 3
op6-level = 56
op6-vel-sens = 6
op6-eg-r2 = 80
op6-eg-l2 = 36
op6-eg-l3 = 18
op6-eg-r4 = 82

filter-enable = true
filter-cutoff = 1800.0
filter-resonance = 0.12
filter-slope = "2-Pole"
filter-drive = 1.6
filter-keytrack = 0.55

# Two lanes, narrow detune — width, not chorus.
stack-density = 2
stack-detune = 6.0
stack-spread = 0.7

hp-cutoff = 30.0

master-volume = -7.69
[[matrix]]
slot = 0
source = "velocity"
dest = "op6-level"
curve = "lin"
depth = 0.42

[[matrix]]
slot = 1
source = "voice-spread"
dest = "op1-pan"
curve = "lin"
depth = 0.5

[[matrix]]
slot = 2
source = "voice-spread"
dest = "op3-pan"
curve = "lin"
depth = -0.5

[[matrix]]
slot = 3
source = "voice-spread"
dest = "op5-pan"
curve = "lin"
depth = 0.8
