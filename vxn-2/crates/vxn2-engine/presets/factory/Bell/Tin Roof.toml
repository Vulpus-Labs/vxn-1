schema = 1

[meta]
name = "Tin Roof"
author = "Vulpus Labs"
category = "Bell"
comment = "Corrugated metal hit with something hard. Feedback at 6.6 pushes op6 past a clean tone into noise, and every ratio is a deliberately ugly non-integer so nothing in the spectrum agrees with anything else. Short, loud, and it does not really have a pitch — play it low and it is a sheet, play it high and it is a bottle."

[params]
algo = 12
feedback = 7

op1-eg-r1 = 99
op1-eg-r2 = 78
op1-eg-l2 = 30
op1-eg-l3 = 0
op1-eg-r3 = 62
op1-eg-r4 = 80
op1-vel-sens = 5
op1-ks-r-depth = 30

# op2 carries the feedback in algo 12 — the noise source.
op2-num = 17
op2-denom = 4
op2-fine = 7
op2-level = 82
op2-vel-sens = 7
op2-eg-r1 = 99
op2-eg-r2 = 84
op2-eg-l2 = 18
op2-eg-l3 = 0
op2-eg-r4 = 86

# op3 carrier, modulated by 4, 5 and 6 in parallel.
op3-num = 7
op3-denom = 2
op3-fine = 3
op3-level = 74
op3-detune = 9
op3-eg-r1 = 99
op3-eg-r2 = 80
op3-eg-l2 = 24
op3-eg-l3 = 0
op3-eg-r4 = 82
op3-ks-r-depth = 34

op4-num = 23
op4-denom = 6
op4-level = 62
op4-vel-sens = 7
op4-eg-r1 = 99
op4-eg-r2 = 88
op4-eg-l2 = 12
op4-eg-l3 = 0

op5-num = 31
op5-denom = 4
op5-level = 54
op5-detune = -8
op5-vel-sens = 6
op5-eg-r1 = 99
op5-eg-r2 = 90
op5-eg-l2 = 10
op5-eg-l3 = 0

op6-num = 29
op6-denom = 8
op6-fine = 9
op6-level = 48
op6-vel-sens = 7
op6-eg-r1 = 99
op6-eg-r2 = 92
op6-eg-l2 = 6
op6-eg-l3 = 0

filter-enable = true
filter-cutoff = 5200.0
filter-resonance = 0.20
filter-slope = "2-Pole"
filter-drive = 2.6
filter-keytrack = 0.35

hp-cutoff = 180.0

reverb-on = true
reverb-size = 0.45
reverb-decay = 1.6
reverb-damp = 0.28
reverb-mix = 0.20

master-volume = -15.93
[[matrix]]
slot = 0
source = "velocity"
dest = "feedback"
curve = "lin"
depth = 0.34

[[matrix]]
slot = 1
source = "velocity"
dest = "op4-level"
curve = "exp"
depth = 0.44

[[matrix]]
slot = 2
source = "voice-rand"
dest = "op3-phase"
curve = "lin"
depth = 1.0
