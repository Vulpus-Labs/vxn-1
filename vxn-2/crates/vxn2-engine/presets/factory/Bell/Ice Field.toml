schema = 1

[meta]
name = "Ice Field"
author = "Vulpus Labs"
category = "Bell"
comment = "Thin, glassy and very high. A static high-pass at 900 Hz removes the strike's body so only the glitter is left, and the long reverb runs almost undamped so the tail stays bright instead of going dull. Four lanes with randomised phase — struck ice never sounds the same twice."

[params]
algo = 29
feedback = 3.49

# Ops 1 and 2 pure carriers, high and detuned against each other.
op1-num = 4
op1-eg-r1 = 99
op1-eg-r2 = 48
op1-eg-l2 = 44
op1-eg-l3 = 14
op1-eg-r3 = 30
op1-eg-r4 = 46
op1-vel-sens = 5

op2-num = 6
op2-level = 76
op2-detune = 8
op2-eg-r1 = 99
op2-eg-r2 = 54
op2-eg-l2 = 36
op2-eg-l3 = 10
op2-eg-r4 = 50

# op3 carrier modulated by op4.
op3-num = 9
op3-level = 62
op3-detune = -7
op3-eg-r1 = 99
op3-eg-r2 = 62
op3-eg-l2 = 28
op3-eg-l3 = 6
op3-eg-r4 = 58

op4-num = 15
op4-level = 52
op4-vel-sens = 7
op4-eg-r1 = 99
op4-eg-r2 = 86
op4-eg-l2 = 10
op4-eg-l3 = 0

# op5 carrier modulated by op6, carrying the feedback.
op5-num = 13
op5-level = 46
op5-detune = 6
op5-eg-r1 = 99
op5-eg-r2 = 70
op5-eg-l2 = 20
op5-eg-l3 = 0
op5-eg-r4 = 66

op6-num = 21
op6-level = 40
op6-vel-sens = 7
op6-eg-r1 = 99
op6-eg-r2 = 90
op6-eg-l2 = 6
op6-eg-l3 = 0

hp-cutoff = 900.0

stack-density = 4
stack-detune = 8.0
stack-spread = 1.0

reverb-on = true
reverb-size = 0.9
reverb-decay = 7.5
reverb-damp = 0.12
reverb-mix = 0.40

delay-on = true
delay-time = 500.0
delay-sync = false
delay-feedback = 0.44
delay-mix = 0.16
delay-pingpong = true

master-volume = -7.68
[[matrix]]
slot = 0
source = "velocity"
dest = "op4-level"
curve = "exp"
depth = 0.46

[[matrix]]
slot = 1
source = "voice-rand"
dest = "op1-phase"
curve = "lin"
depth = 1.0

[[matrix]]
slot = 2
source = "voice-rand"
dest = "op3-phase"
curve = "lin"
depth = 1.0

[[matrix]]
slot = 3
source = "voice-spread"
dest = "op1-pan"
curve = "lin"
depth = 1.0

[[matrix]]
slot = 4
source = "voice-spread"
dest = "op3-pan"
curve = "lin"
depth = -1.0
