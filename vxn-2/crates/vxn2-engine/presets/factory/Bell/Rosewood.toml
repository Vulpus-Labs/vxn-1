schema = 1

[meta]
name = "Rosewood"
author = "Vulpus Labs"
category = "Bell"
comment = "Marimba, and the closest thing here to modelling an actual instrument. A marimba bar sits over a tube tuned to the bar's own fundamental, so the resonance is at a fixed ratio to the pitch — which is precisely what a ratio-locked band-pass is. Base cutoff at the C0 floor with keytrack 1.0 centres it on the fundamental of every note; the resonance is the tube length. Bars are tuned to their 4th harmonic, so op2 sits two octaves up."

[params]
algo = 7
feedback = 0.0

# op1 — the bar fundamental.
op1-eg-r1 = 99
op1-eg-r2 = 66
op1-eg-l2 = 46
op1-eg-l3 = 0
op1-eg-r3 = 52
op1-eg-r4 = 74
op1-vel-sens = 4
op1-ks-r-depth = 36

# op2 -> op1 at 4:1 — the bar's tuned overtone, two octaves up.
op2-num = 4
op2-level = 64
op2-vel-sens = 7
op2-eg-r1 = 99
op2-eg-r2 = 86
op2-eg-l2 = 12
op2-eg-l3 = 0
op2-eg-r4 = 88

# op3 carrier — the wooden knock of the mallet.
op3-num = 10
op3-level = 48
op3-vel-sens = 7
op3-eg-r1 = 99
op3-eg-r2 = 94
op3-eg-l2 = 0
op3-eg-l3 = 0
op3-eg-r3 = 92
op3-eg-r4 = 94
op3-ks-r-depth = 48

op4-num = 7
op4-level = 42
op4-vel-sens = 6
op4-eg-r1 = 99
op4-eg-r2 = 92
op4-eg-l2 = 8
op4-eg-l3 = 0

op5-num = 3
op5-level = 36
op5-eg-r1 = 99
op5-eg-r2 = 88
op5-eg-l2 = 14
op5-eg-l3 = 0

op6-num = 13
op6-level = 26
op6-vel-sens = 7
op6-eg-r1 = 99
op6-eg-r2 = 96
op6-eg-l2 = 4
op6-eg-l3 = 0

# The resonator tube. 16.3516 = CUTOFF_MIN_HZ, so keytrack 1.0 puts the
# centre exactly on the played fundamental at every pitch. High resonance
# is a long tube; drive stays low so it rings rather than growls.
filter-enable = true
filter-cutoff = 16.3516
filter-resonance = 0.66
filter-mode = "BP"
filter-slope = "2-Pole"
filter-drive = 1.2
filter-keytrack = 1.0

reverb-on = true
reverb-size = 0.5
reverb-decay = 1.8
reverb-damp = 0.5
reverb-mix = 0.18

master-volume = -19.08
[[matrix]]
slot = 0
source = "velocity"
dest = "op2-level"
curve = "exp"
depth = 0.50

[[matrix]]
slot = 1
source = "velocity"
dest = "op3-level"
curve = "exp"
depth = 0.44
