schema = 1

[meta]
name = "Angelus"
author = "Vulpus Labs"
category = "Bell"
comment = "A big church bell, heard from outside. The hum note sits an octave below the strike — op3 at 1:2 — which is what makes a large bell read as large. Six seconds of reverb and a pitch envelope that drops a few cents over the first second, the way a heavy bell settles after it is struck."

[params]
algo = 6
feedback = 6.26

op1-eg-r1 = 99
op1-eg-r2 = 26
op1-eg-l2 = 66
op1-eg-l3 = 34
op1-eg-r3 = 16
op1-eg-r4 = 26
op1-vel-sens = 3
op1-ks-r-depth = 10

op2-num = 5
op2-denom = 2
op2-level = 90
op2-vel-sens = 5
op2-eg-r1 = 99
op2-eg-r2 = 34
op2-eg-l2 = 48
op2-eg-l3 = 20
op2-eg-r4 = 32

# The hum note, an octave under the strike.
op3-num = 1
op3-denom = 2
op3-level = 92
op3-eg-r1 = 99
op3-eg-r2 = 22
op3-eg-l2 = 72
op3-eg-l3 = 40
op3-eg-r3 = 14
op3-eg-r4 = 24
op3-ks-r-depth = 8

op4-num = 3
op4-level = 80
op4-detune = -6
op4-vel-sens = 5
op4-eg-r1 = 99
op4-eg-r2 = 38
op4-eg-l2 = 40
op4-eg-l3 = 16
op4-eg-r4 = 34

# Two-op feedback loop across 5 and 6 — the clang.
op5-num = 7
op5-denom = 2
op5-level = 84
op5-detune = 7
op5-vel-sens = 6
op5-eg-r1 = 99
op5-eg-r2 = 56
op5-eg-l2 = 26
op5-eg-l3 = 8
op5-eg-r4 = 54

op6-num = 8
op6-level = 72
op6-vel-sens = 7
op6-eg-r1 = 99
op6-eg-r2 = 84
op6-eg-l2 = 8
op6-eg-l3 = 0

# Heavy bells settle slightly flat after the strike.
peg-r1 = 78
peg-r2 = 62
peg-l1 = 4
peg-l2 = 0
peg-l3 = 0
peg-l4 = 0
peg-depth = 3.0

stack-density = 2
stack-detune = 5.0
stack-spread = 0.8

hp-cutoff = 34.0

reverb-on = true
reverb-size = 0.95
reverb-decay = 6.5
reverb-damp = 0.42
reverb-mix = 0.38

master-volume = -17.75
[[matrix]]
slot = 0
source = "velocity"
dest = "op6-level"
curve = "exp"
depth = 0.48

[[matrix]]
slot = 1
source = "voice-spread"
dest = "op1-pan"
curve = "lin"
depth = 0.8

[[matrix]]
slot = 2
source = "voice-spread"
dest = "op3-pan"
curve = "lin"
depth = -0.8
