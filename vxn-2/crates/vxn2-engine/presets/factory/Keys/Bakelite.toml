schema = 1

[meta]
name = "Bakelite"
author = "Vulpus Labs"
category = "Keys"
comment = "Clavinet: hard, short, and all midrange. Algo 4's wrapped three-op feedback loop makes a buzz that a single feedback op cannot, and a static high-pass under a resonant ladder trims the lows and the air so the bark dominates. Velocity opens the band — the instrument gets brighter and more nasal as you hit it."

[params]
algo = 4
feedback = 4.4

op1-eg-r1 = 99
op1-eg-r2 = 68
op1-eg-l2 = 62
op1-eg-l3 = 42
op1-eg-r4 = 92
op1-vel-sens = 5
op1-ks-r-depth = 34

op2-level = 76
op2-vel-sens = 6
op2-eg-r1 = 99
op2-eg-r2 = 82
op2-eg-l2 = 48
op2-eg-l3 = 18
op2-eg-r4 = 92

op3-num = 3
op3-level = 62
op3-vel-sens = 5
op3-eg-r1 = 99
op3-eg-r2 = 86
op3-eg-l2 = 26
op3-eg-l3 = 10
op3-eg-r4 = 92

# Ops 4/5/6 are the feedback loop — keep them terse.
op4-num = 2
op4-level = 58
op4-eg-r1 = 99
op4-eg-r2 = 88
op4-eg-l2 = 40
op4-eg-l3 = 6

op5-num = 4
op5-level = 44
op5-eg-r1 = 99
op5-eg-r2 = 90
op5-eg-l2 = 16
op5-eg-l3 = 0

op6-num = 6
op6-level = 32
op6-eg-r1 = 99
op6-eg-r2 = 92
op6-eg-l2 = 12
op6-eg-l3 = 0

# Fast index envelope, doubling as a cutoff blip on the attack.
mod-env-a = 1.0
mod-env-d = 140.0
mod-env-s = 0.0
mod-env-r = 90.0

# The band is a static HP under the resonant ladder rather than the ladder's
# own BP mode. Not because BP is lossy — centred on a tone it is transparent —
# but because a 2-pole BP keeps one 6 dB/oct window and throws the rest away,
# and a clavinet needs its body as well as its bark. HP+LP keeps everything
# between 220 Hz and the ladder instead of just the neighbourhood of one centre.
filter-enable = true
filter-cutoff = 2400.0
filter-resonance = 0.38
filter-slope = "2-Pole"
filter-drive = 3.0
filter-keytrack = 0.60

hp-cutoff = 220.0

delay-on = true
delay-time = 160.0
delay-sync = false
delay-feedback = 0.18
delay-mix = 0.10

master-volume = -9.11
[[matrix]]
slot = 0
source = "velocity"
dest = "cutoff"
curve = "lin"
depth = 0.44

[[matrix]]
slot = 1
source = "velocity"
dest = "op2-level"
curve = "lin"
depth = 0.34

[[matrix]]
slot = 2
source = "mod-env"
dest = "cutoff"
curve = "exp"
depth = 0.30
