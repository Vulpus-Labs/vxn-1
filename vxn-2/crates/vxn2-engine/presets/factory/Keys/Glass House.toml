schema = 1

[meta]
name = "Glass House"
author = "Vulpus Labs"
category = "Keys"
comment = "Struck glass rather than struck string. Algo 25 leaves ops 1-3 as pure unmodulated carriers, so their ratios are heard directly — set to 1, 2 and 5.51, they beat against each other instead of fusing into a pitch. Op6 modulates the two upper carriers only, keeping the strike bright while the body stays clean. Three lanes spread wide."

[params]
algo = 25
feedback = 3.26

# Three pure carriers. The 5.51 is deliberately off-integer.
op1-eg-r1 = 99
op1-eg-r2 = 42
op1-eg-l2 = 66
op1-eg-l3 = 34
op1-eg-r3 = 30
op1-eg-r4 = 44
op1-ks-r-depth = 18

op2-num = 2
op2-level = 76
op2-eg-r1 = 99
op2-eg-r2 = 48
op2-eg-l2 = 54
op2-eg-l3 = 24
op2-eg-r3 = 34
op2-eg-r4 = 48
op2-ks-r-depth = 22

op3-num = 11
op3-denom = 2
op3-fine = 2
op3-level = 54
op3-detune = 7
op3-eg-r1 = 99
op3-eg-r2 = 58
op3-eg-l2 = 34
op3-eg-l3 = 10
op3-eg-r3 = 44
op3-eg-r4 = 56
op3-ks-r-depth = 30

# Carriers 4 and 5, modulated by op6 — the bright strike layer.
op4-num = 3
op4-level = 62
op4-vel-sens = 6
op4-eg-r1 = 99
op4-eg-r2 = 76
op4-eg-l2 = 26
op4-eg-l3 = 0
op4-eg-r4 = 70

op5-num = 4
op5-level = 48
op5-detune = -6
op5-vel-sens = 6
op5-eg-r1 = 99
op5-eg-r2 = 80
op5-eg-l2 = 20
op5-eg-l3 = 0
op5-eg-r4 = 72

op6-num = 7
op6-level = 58
op6-vel-sens = 7
op6-eg-r1 = 99
op6-eg-r2 = 88
op6-eg-l2 = 12
op6-eg-l3 = 0
op6-eg-r4 = 86

stack-density = 3
stack-detune = 5.0
stack-spread = 0.85

reverb-on = true
reverb-size = 0.7
reverb-decay = 3.2
reverb-damp = 0.35
reverb-mix = 0.28

master-volume = -9.93
[[matrix]]
slot = 0
source = "velocity"
dest = "op6-level"
curve = "exp"
depth = 0.50

[[matrix]]
slot = 1
source = "voice-spread"
dest = "op1-pan"
curve = "lin"
depth = 0.7

[[matrix]]
slot = 2
source = "voice-spread"
dest = "op2-pan"
curve = "lin"
depth = -0.7

[[matrix]]
slot = 3
source = "voice-spread"
dest = "op3-pan"
curve = "lin"
depth = 1.0

[[matrix]]
slot = 4
source = "voice-rand"
dest = "op3-phase"
curve = "lin"
depth = 1.0
