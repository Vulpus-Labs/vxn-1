[package]
name = "vxn4-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "VXN4 engine — voice allocation, envelopes, patches and the oversampling chain."

[dependencies]
vxn4-dsp = { workspace = true }
vxn-core-utils = { workspace = true }
vxn-core-matrix = { workspace = true }
# `ParamDesc` / `ParamKind` / `Taper` for the patch descriptor table (0381), and
# `ParamId` as the id that indexes it. Schema and taper math only — this pulls in
# no controller, no backend and no windowing.
vxn-core-app = { workspace = true }
# Sparse-TOML preset scaffold (Meta/Header/SCHEMA/value_for) shared across the
# synths — the preset codec (0383) builds on it rather than re-rolling a third
# copy of the envelope.
vxn-preset = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
