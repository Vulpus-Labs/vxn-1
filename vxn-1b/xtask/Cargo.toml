[package]
name = "vxn1b-xtask"
# Kept as an explicit pin rather than `version.workspace`: VXN1b ships on its
# own tag line (`vxn-1b-<version>`) and stays free to diverge again. As of 0.2.0
# the NUMBER is deliberately aligned with the shared workspace line vxn-2 rides,
# retiring the earlier independent 0.0.x sequence — the release lines stay two,
# only the versions now agree. The xtask stamps this into the bundle Info.plist.
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
vxn-xtask-common = { path = "../../crates/vxn-xtask-common" }
