[package]
name = "vxn1b-ui-web"
# VXN1b versions independently of the shared 0.x line that vxn-1/vxn-2 ride
# (workspace 0.1.1): it is a younger variant shipping its own 0.0.x releases,
# tagged `vxn-1b-<version>`. The xtask stamps this into the bundle Info.plist.
version = "0.0.2"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "VXN1b HTML faceplate — skeleton; compact faceplate + mod-matrix overlay land in E038."

[dependencies]
vxn-core-ui-web = { workspace = true }
# Param table + descriptor schema the faceplate splices into `window.vxn.params`.
vxn1b-engine = { workspace = true }
# ParamDesc / ParamKind / Taper the descriptor JSON operates on, plus the
# ControllerHandle / CorpusHandle the `open_editor` wrapper takes.
vxn-core-app = { workspace = true }

# IPC payloads are JSON; the descriptor-JSON builder shapes them by hand.
serde_json = "1"
