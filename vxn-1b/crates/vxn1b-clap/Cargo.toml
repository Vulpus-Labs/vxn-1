[package]
name = "vxn1b-clap"
# Kept as an explicit pin rather than `version.workspace`: VXN1b ships on its
# own tag line (`vxn-1b-<version>`) and stays free to diverge again. As of 0.2.0
# the NUMBER is deliberately aligned with the shared workspace line vxn-2 rides,
# retiring the earlier independent 0.0.x sequence — the release lines stay two,
# only the versions now agree. The xtask stamps this into the bundle Info.plist.
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "VXN1b CLAP plugin shell (clack) — host-loadable scaffold."

[lib]
# cdylib for the host-loadable plugin; rlib so in-process tests link the shell
# without dlopen; staticlib for clap-wrapper to link into a bundled .vst3
# (mirrors vxn-clap / ADR 0008 §2).
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
vxn1b-engine = { workspace = true }
# The HTML webview editor backend (E038): open_editor + EditorHandle, driven
# from the CLAP gui + timer extensions wired here.
vxn1b-ui-web = { workspace = true }
# Shared clack helper (batch_range for event-batch → frame mapping). The
# note/param dispatch is bespoke here — VXN1b is MPE-aware and the shared
# EngineNotes dispatch is channel-agnostic (drops channel + per-note pressure).
vxn-core-clap = { workspace = true }
# ParamKind — the stepped/continuous discriminant get_info reports to the host.
vxn-core-app = { workspace = true }
clack-plugin = { workspace = true }
clack-extensions = { workspace = true, features = [
    "audio-ports",
    "note-ports",
    "params",
    "state",
    "gui",
    "timer",
    "clack-plugin",
] }
