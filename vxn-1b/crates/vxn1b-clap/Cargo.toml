[package]
name = "vxn1b-clap"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "VXN1b CLAP plugin shell (clack) — host-loadable scaffold."

[lib]
# cdylib for the host-loadable plugin; rlib so in-process tests link the shell
# without dlopen.
crate-type = ["cdylib", "rlib"]

[dependencies]
vxn1b-engine = { workspace = true }
clack-plugin = { workspace = true }
clack-extensions = { workspace = true, features = [
    "audio-ports",
    "note-ports",
    "clack-plugin",
] }
