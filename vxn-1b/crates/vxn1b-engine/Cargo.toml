[package]
name = "vxn1b-engine"
# VXN1b versions independently of the shared 0.x line that vxn-1/vxn-2 ride
# (workspace 0.1.1): it is a younger variant shipping its own 0.0.x releases,
# tagged `vxn-1b-<version>`. The xtask stamps this into the bundle Info.plist.
version = "0.0.2"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "VXN1b engine — param table + mod-matrix routing loop over VXN1's shared vxn-dsp kernels."

[dependencies]
# ADR 0001 §1: VXN1b reuses VXN1's DSP verbatim via a direct crate dependency,
# not a fork — later tickets wire these kernels rather than porting them.
vxn-dsp = { workspace = true }
vxn-core-utils = { workspace = true }
# ParamDesc / ParamKind / Taper — the shared param schema shape + taper math
# (VXN1's table forks the same descriptor type, ADR 0001 §5).
vxn-core-app = { workspace = true }
# Sparse-TOML preset scaffold (Meta/Header/SCHEMA/value_for) shared across the
# synths — the TOML persistence path (0203) builds on it rather than re-rolling.
vxn-preset = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Bakes the factory preset tree into the rlib (0212). Main-thread only — the
# audio path never parses TOML. Emits no rerun-if-changed, so `xtask` touches
# `factory.rs` before an install.
include_dir = "0.7"

[dev-dependencies]
# VXN1's engine — the render-parity oracle (0202): the seeded default patch must
# reproduce VXN1's fixed-routing output. Test-only.
vxn-engine = { workspace = true }
vxn-app = { workspace = true }
