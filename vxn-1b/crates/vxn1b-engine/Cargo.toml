[package]
name = "vxn1b-engine"
# Workspace version: since 0.2.0 VXN1b and vxn-2 are one release, on one tag,
# so an independent pin here could only ever drift out of step with the thing
# it ships beside. The xtask stamps this into the bundle Info.plist.
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "VXN1b engine — param table + mod-matrix routing loop over VXN1's shared vxn-dsp kernels."

[dependencies]
# ADR 0001 §1: VXN1b reuses VXN1's DSP verbatim via a direct crate dependency,
# not a fork — later tickets wire these kernels rather than porting them.
vxn-dsp = { workspace = true }
vxn-core-utils = { workspace = true }
# Shared mod-matrix routing (ADR 0003 / epic E049): the polarity/shape axes,
# the `matrix_enum!` generator behind every name/label table below, the flat
# preset curve codec and the scale VCA.
vxn-core-matrix = { workspace = true }
# ParamDesc / ParamKind / Taper — the shared param schema shape + taper math
# (VXN1's table forks the same descriptor type, ADR 0001 §5).
vxn-core-app = { workspace = true }
# Sparse-TOML preset scaffold (Meta/Header/SCHEMA/value_for) shared across the
# synths — the TOML persistence path (0203) builds on it rather than re-rolling.
vxn-preset = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Bakes the factory preset tree into the rlib (0212). Main-thread only — the
# audio path never parses TOML. Emits no rerun-if-changed, so `xtask` touches
# `factory.rs` before an install.
include_dir = "0.7"

[dev-dependencies]
# Real directories for the user-preset filesystem tests (0320). The path-escape
# guard and the folder operations are only meaningfully testable against a live
# tree, and they must not touch the developer's own preset directory.
#
# (The VXN1 render-parity oracle used to be declared here; vxn-1 was archived
# out of the workspace on 2026-08-27 and only this comment survived it.)
tempfile = "3"
# `vxn_core_matrix::golden` — the shared golden-vector table (0331). The
# `testing` feature exposes it (and the synthetic roster it is written against)
# outside that crate's own unit tests; declaring it here rather than in
# `[dependencies]` keeps it out of every shipped binary, and costs no extra
# compile because the engine already depends on the crate.
vxn-core-matrix = { workspace = true, features = ["testing"] }
# `test_util::assert_null_test` — the shared render comparator E049 is judged
# against (0329). A dev-dep only: nothing in the engine's own build depends on
# it, and `vxn-dsp` already pulls the crate in, so this costs no extra compile.
vxn-core-dsp = { workspace = true }
# Matrix bench (0329). vxn-1b had only `examples/route_profile.rs`, which times
# a whole render rather than the routing stage, so 0334/0337 had no vxn-1b
# before/after numbers to quote.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "matrix"
harness = false
