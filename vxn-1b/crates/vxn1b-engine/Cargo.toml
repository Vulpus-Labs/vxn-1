[package]
name = "vxn1b-engine"
# Kept as an explicit pin rather than `version.workspace`: VXN1b ships on its
# own tag line (`vxn-1b-<version>`) and stays free to diverge again. As of 0.2.0
# the NUMBER is deliberately aligned with the shared workspace line vxn-2 rides,
# retiring the earlier independent 0.0.x sequence — the release lines stay two,
# only the versions now agree. The xtask stamps this into the bundle Info.plist.
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "VXN1b engine — param table + mod-matrix routing loop over VXN1's shared vxn-dsp kernels."

[dependencies]
# ADR 0001 §1: VXN1b reuses VXN1's DSP verbatim via a direct crate dependency,
# not a fork — later tickets wire these kernels rather than porting them.
vxn-dsp = { workspace = true }
vxn-core-utils = { workspace = true }
# ParamDesc / ParamKind / Taper — the shared param schema shape + taper math
# (VXN1's table forks the same descriptor type, ADR 0001 §5).
vxn-core-app = { workspace = true }
# Sparse-TOML preset scaffold (Meta/Header/SCHEMA/value_for) shared across the
# synths — the TOML persistence path (0203) builds on it rather than re-rolling.
vxn-preset = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Bakes the factory preset tree into the rlib (0212). Main-thread only — the
# audio path never parses TOML. Emits no rerun-if-changed, so `xtask` touches
# `factory.rs` before an install.
include_dir = "0.7"

[dev-dependencies]
# Real directories for the user-preset filesystem tests (0320). The path-escape
# guard and the folder operations are only meaningfully testable against a live
# tree, and they must not touch the developer's own preset directory.
#
# (The VXN1 render-parity oracle used to be declared here; vxn-1 was archived
# out of the workspace on 2026-08-27 and only this comment survived it.)
tempfile = "3"
